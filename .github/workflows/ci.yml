name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    # Skip Dependabot-triggered runs: they get read-only permissions and
    # no secrets, so the tests add no signal for dependency bumps.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install Pillow exifread piexif

      - name: Run tests
        run: python3 test_sortinfolder.py